name: iOS Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available

      - name: List Xcode schemes
        run: |
          xcodebuild -list -project synclifters.xcodeproj

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          DEVICE=$(
            xcrun simctl list devices available -j |
              jq -r '
                [
                  .devices
                  | to_entries[]
                  | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
                  | .key as $runtime
                  | .value[]
                  | select(.isAvailable == true)
                  | select(.name | startswith("iPhone"))
                  | "\($runtime)|\(.name)|\(.udid)"
                ]
                | .[]
              ' |
              sort -V -t '|' -k1,1 -k2,2 |
              tail -n 1
          )

          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          UDID="${DEVICE##*|}"
          echo "Selected simulator: $DEVICE"
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project synclifters.xcodeproj \
            -scheme synclifters \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
