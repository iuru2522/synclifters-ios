        run: |
          xcodebuild -list -project synclifters.xcodeproj

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          DEVICE=$(
            xcrun simctl list devices available -j |
              jq -r '
                [
                  .devices
                  | to_entries[]
                  | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
                  | .key as $runtime
                  | .value[]
                  | select(.isAvailable == true)
                  | select(.name | startswith("iPhone"))
                  | "\($runtime)|\(.name)|\(.udid)"
                ]
                | .[]
              ' |
              sort -V -t '|' -k1,1 -k2,2 |
              tail -n 1
          )

          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          UDID="${DEVICE##*|}"
          echo "Selected simulator: $DEVICE"
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project synclifters.xcodeproj \
            -scheme synclifters \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project synclifters.xcodeproj \
            -scheme synclifters \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
